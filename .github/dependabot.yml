version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 (tsgo) drops the JS compiler API (exports "." resolves to
      # lib/version.cjs only), so next build cannot read tsconfig paths and fails
      # with module-not-found on every "@/*" import (vercel/next.js#95633).
      # Remove once Next.js >= 16.3 with experimental.useTypeScriptCli is adopted
      # or TypeScript 7.1 restores the JS API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # tauri-action v1 breaks the desktop publish flow: latest.json asset URLs
      # switch to the GitHub API form, which the sed rewrite to sugara-releases
      # cannot handle. Remove this once the publish job is migrated
      # (see the note in desktop-build.yml).
      - dependency-name: "tauri-apps/tauri-action"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns:
          - "*"
