name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # E2E is heavy (full prod build + Supabase + serial Playwright) and no longer
  # runs on PRs; it runs post-merge on main, nightly, and on demand instead.
  schedule:
    - cron: "0 17 * * *" # 02:00 JST
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    needs: changes
    # Docs-only PRs (Markdown only) skip this job. A skipped required check still
    # reports success to Branch Protection, so the PR stays mergeable without
    # [skip ci] (which would suppress the check run entirely and deadlock the
    # merge). Pushes to main always run the full suite.
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.2"

      # --ignore-scripts blocks postinstall hooks at install time to defend against supply-chain
      # compromises. For dependabot PRs we drop --frozen-lockfile so bun can rewrite bun.lock
      # (dependabot itself doesn't update bun.lock); a follow-up workflow commits the result.
      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            bun install --ignore-scripts
          else
            bun install --frozen-lockfile --ignore-scripts
          fi

      - name: Biome (lint + format)
        run: bun run check

      - name: TypeScript
        run: bun run check-types

      # Block "critical" advisories explicitly; high is noisy and often transitive, so we
      # surface them without failing the build. bun audit's own exit code behaves
      # inconsistently (exits 1 on any advisory regardless of --level), so we parse output.
      - name: Dependency audit (critical gate)
        run: |
          set +e
          audit_output=$(bun audit 2>&1)
          echo "$audit_output"
          if echo "$audit_output" | grep -qiE '^\s*critical:'; then
            echo "::error::Critical advisory detected, blocking merge"
            exit 1
          fi
          exit 0

      - name: Dependency audit (high, informational)
        run: bun audit
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: changes
    # Required check; skipped on docs-only PRs (see `check` for rationale).
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.2"

      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            bun install --ignore-scripts
          else
            bun install --frozen-lockfile --ignore-scripts
          fi

      - name: Vitest (unit)
        run: bun run test

  test-integration:
    runs-on: ubuntu-latest
    needs: changes
    # Not a required check, but skipped on docs-only PRs to save CI minutes.
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Build the sugara_test database and the unprivileged sugara role integration tests use.
      # Using service-port 54322 (mapped to postgres:5432) regardless of the 55322 dev port
      # because the CI postgres instance is isolated from developer machines.
      - name: Provision test database and role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -c "CREATE DATABASE sugara_test;" || true
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'sugara') THEN
                CREATE USER sugara WITH PASSWORD 'sugara';
              END IF;
            END \$\$;
            GRANT ALL PRIVILEGES ON DATABASE sugara_test TO sugara;
            ALTER ROLE sugara BYPASSRLS;
          "
          psql -h 127.0.0.1 -p 54322 -U postgres -d sugara_test -c "
            CREATE SCHEMA IF NOT EXISTS drizzle;
            GRANT ALL ON SCHEMA public TO sugara;
            GRANT ALL ON SCHEMA drizzle TO sugara;
          "

      - name: Apply migrations to sugara_test
        env:
          MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:54322/sugara_test
        run: bun run --filter @sugara/api db:migrate

      - name: Grant table privileges to sugara role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d sugara_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO sugara;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO sugara;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA drizzle TO sugara;
          "

      - name: Vitest (integration)
        env:
          TEST_DATABASE_URL: postgresql://sugara:sugara@127.0.0.1:54322/sugara_test
        run: bun run --filter @sugara/api test:integration

  # Detects docs-only (Markdown-only) PRs so the check / test / test-integration
  # jobs skip them, while a skipped required check still reports success to
  # Branch Protection (same idea as Vercel's native skipping).
  changes:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block entirely, so
    # contents: read must be restated for checkout.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.codefilter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # `code` is true for any change that is NOT purely Markdown, so docs-only PRs
      # skip check/test/test-integration. predicate-quantifier: 'every' is required
      # because the default 'some' (OR) mode makes a lone '!**/*.md' match nearly
      # every file, which would break the negation; a single positive '**' avoids
      # the 'every' + multi-positive AND pitfall. Negation defaults to true (run
      # CI) for any new non-Markdown path.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: codefilter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'

  # Playwright suite against a production build backed by the same local Supabase
  # stack developers use (Postgres 55322 / Realtime / Storage), so CI mirrors
  # `bun run test:e2e`. Heavy and serial (workers: 1), so it is kept off PRs: it
  # runs post-merge on main, nightly (schedule), and on demand (workflow_dispatch).
  # Run it locally with `bun run test:e2e` before pushing risky UI changes.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Never on PRs; runs on push to main, the nightly schedule, and manual dispatch.
    if: github.event_name != 'pull_request'
    env:
      # Throwaway secret for the job-local ephemeral database; not a real credential.
      BETTER_AUTH_SECRET: e2e-ci-only-secret
      # apps/api/src/lib/env.ts getters are lazy but throw when reached; no e2e
      # flow sends mail (signup is username-based), so harmless dummies suffice.
      GMAIL_USER: ci-dummy@example.com
      GMAIL_APP_PASSWORD: ci-dummy
      # E2E page.goto() full loads hit /api/auth/* far more often per IP-minute
      # than real browsing; raise the broad auth ceiling for the suite only
      # (routes/auth.ts defaults to 30 when unset — production is unaffected).
      E2E_AUTH_RATE_LIMIT_MAX: "120"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.2"

      - name: Cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            bun install --ignore-scripts
          else
            bun install --frozen-lockfile --ignore-scripts
          fi

      # The browser build is pinned by @playwright/test in bun.lock, so the
      # lockfile hash keys the cache; on a hit the install step only verifies.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      # Next.js incremental compilation cache — keyed on sources so warm builds
      # reuse unchanged modules. restore-keys makes any prior cache a useful base.
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/api/src/**', 'packages/shared/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      # Pinned to the CLI version used for local development so config.toml is
      # interpreted identically.
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.76.7"

      # Studio and the mail-test UI are dev conveniences no test touches.
      - name: Start Supabase stack
        run: supabase start -x studio,inbucket

      # The local stack issues deterministic demo keys (not production secrets);
      # export them for the Next.js build (NEXT_PUBLIC_*) and the API runtime.
      - name: Export Supabase keys
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # MIGRATION_URL defaults to 127.0.0.1:55322, which is exactly where
      # `supabase start` puts Postgres, so no override is needed. db:seed is
      # intentionally skipped: it provisions users through the auth HTTP API
      # (server not yet running here) and e2e tests sign up their own users;
      # only the FAQ seed (direct Postgres) is needed for page content.
      - name: Apply migrations and seed
        run: |
          bun run db:migrate
          bun run db:seed-faqs

      - name: Install Playwright browsers
        run: bun run --filter @sugara/web test:e2e:install

      - name: Build web
        run: bun run --filter @sugara/web build

      - name: Start web server
        run: |
          bun run --filter @sugara/web start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Web server failed to start"
          exit 1

      - name: Playwright e2e
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
