name: Dependabot Auto-Merge

on: pull_request

# Deny everything by default; each job declares only what it needs.
permissions: {}

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    # Only the push of the regenerated bun.lock needs write access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Do not leave the write-capable token in .git/config where install-time code could read it.
          # The token is passed explicitly only to the push step below.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.2"

      # --ignore-scripts: re-resolving the lockfile does not need lifecycle scripts, and freshly
      # bumped packages must not run code at install time (same policy as ci.yml).
      # --frozen-lockfile is intentionally omitted so bun can rewrite bun.lock.
      - name: Update lockfile
        run: bun install --ignore-scripts

      - name: Commit lockfile if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env, never interpolated into the script (head_ref is attacker-influenced).
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if git diff --quiet bun.lock; then
            echo "Lockfile is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: bun.lock を更新"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
          fi

  auto-merge:
    runs-on: ubuntu-latest
    needs: update-lockfile
    if: github.actor == 'dependabot[bot]'
    # `gh pr merge --auto` enables auto-merge via GraphQL, which needs both scopes.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
