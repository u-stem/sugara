# App version is managed solely in tauri.conf.json (Tauri uses it as the single
# source of truth and overrides this value). Keep this fixed at 0.0.0 — this crate
# is never published, and its version only appears in cargo build logs.
[package]
name = "sugara-desktop"
version = "0.0.0"
edition = "2021"

[lib]
name = "sugara_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The default `zip` feature only handles zipped Windows bundles and compressed
# AppImages. Releases ship the NSIS setup.exe and macOS .app.tar.gz (tar/flate2
# are unconditional on macOS), so dropping it removes the vulnerable zip 4.x crate.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-dialog = "2"
serde_json = "1"
chrono = "0.4"
